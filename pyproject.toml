[project]
name = "voice-agent"
version = "0.1.0"
description = "Voice agent using OpenAI and ElevenLabs"
authors = [
    {name = "User"}
]
dependencies = [
    "python-dotenv>=1.0.0",
    "openai>=1.0.0",
    "elevenlabs[pyaudio]>=0.2.26",
    "pyaudio>=0.2.13",
    "numpy>=1.24.3",
    "wave>=0.0.2",
]
requires-python = ">=3.8"
readme = "README.md"
license = {text = "MIT"}

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.rye]
managed = true
dev-dependencies = []

[tool.hatch.metadata]
allow-direct-references = true
